name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Apple Silicon binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Intel binary
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create Universal Binary
        run: |
          lipo -create -output rn-ccusage \
            target/aarch64-apple-darwin/release/rn-ccusage \
            target/x86_64-apple-darwin/release/rn-ccusage

      - name: Archive production binary
        run: tar -czf rn-ccusage-mac.tar.gz rn-ccusage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: "Release v${{ steps.get_version.outputs.VERSION }}"
          prerelease: false
          files: |
            rn-ccusage-mac.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
