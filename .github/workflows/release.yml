name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build Apple Silicon binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Intel binary
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create Universal Binary
        run: |
          lipo -create -output runcat-neo-ccusage \
            target/aarch64-apple-darwin/release/runcat-neo-ccusage \
            target/x86_64-apple-darwin/release/runcat-neo-ccusage

      - name: Archive production binary
        run: tar -czf runcat-neo-ccusage-mac.tar.gz runcat-neo-ccusage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            runcat-neo-ccusage-mac.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
